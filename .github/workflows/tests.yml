name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # opencv-python links against libGL, which isn't present on the runner.
      - name: Install OpenCV system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: |
          python tests/test_compression.py -v
          python tests/test_enhance.py -v
          python tests/test_features.py -v
          python tests/test_launcher.py -v

      # The real launch path end to end: preflight, engine self-test, Streamlit
      # start-up and the health check, then a clean shutdown.
      - name: Smoke-test the launcher
        run: python launch.py --once --no-browser --no-venv

      # The CLI is the entry point most likely to break silently: nothing else
      # exercises the console script, the batch loop or the overwrite guard.
      - name: Smoke-test the CLI
        run: |
          python tests/make_ci_image.py ci.png
          pixelopt ci.png --target 40 -o ci_out.jpg
          python tests/assert_under.py ci_out.jpg 40
          pixelopt ci.png --target 40 -e auto -o ci_enh.jpg
          python tests/assert_under.py ci_enh.jpg 40

      - name: Benchmark
        run: python benchmark.py --targets 25 100 300
