name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # opencv-python links against libGL, which isn't present on the runner.
      - name: Install OpenCV system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The trained model is committed, so the compression tests run against
      # the real regressor rather than a fallback fitted at test time.
      - name: Run tests
        env:
          PYTHONPATH: .
        run: python tests/test_compression.py -v

      - name: Benchmark
        env:
          PYTHONPATH: .
        run: python benchmark.py --targets 100 300
