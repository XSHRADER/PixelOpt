[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelopt"
version = "0.2.0"
description = "Fit images into a byte budget at the highest measured quality."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "opencv-python>=4.8.0,<5.0.0",
    "scikit-image>=0.22.0,<1.0.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.33.0,<2.0.0"]

[project.scripts]
pixelopt = "pixelopt.cli:main"

[tool.setuptools]
packages = ["pixelopt"]
